<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dupit Birthday</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:#ffd6e7;
  overflow:hidden;
}

.page{
  width:100%;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:60px;
  padding:40px;
}

.photo-frame{
  padding:12px;
  border:10px solid #ff4f8b;
  background:white;
  border-radius:25px;
  box-shadow:0 0 20px rgba(0,0,0,0.15);
}

.photo-frame img{
  width:320px;
  height:320px;
  object-fit:cover;
  border-radius:15px;
  display:block;
}

.content{
  max-width:650px;
}

.name{
  font-family:'Bebas Neue',sans-serif;
  font-size:90px;
  color:#ff4f8b;
  margin-bottom:30px;
}

.text{
  font-size:28px;
  line-height:1.8;
  color:#ff4f8b;
}

.btn{
  margin-top:40px;
  padding:18px 50px;
  border:none;
  border-radius:50px;
  background:#ff4f8b;
  color:white;
  font-size:24px;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  transform:scale(1.05);
}

@media(max-width:900px){

  .page{
    flex-direction:column;
    text-align:center;
  }

  .name{
    font-size:55px;
  }

  .text{
    font-size:22px;
  }

  .photo-frame img{
    width:250px;
    height:250px;
  }

}

</style>
</head>

<body>

<div class="page">

  <div class="photo-frame">

    <!-- IMAGE -->
    <img src="./Birthday-pic.png" alt="Birthday Picture">

  </div>

  <div class="content">

    <div class="name">
      HAPPY BIRTHDAY DUPIT 🎀
    </div>

    <div class="text">

      Congratulations bro… you survived another year
      of your own stupidity 😭🎂

      <br><br>

      You’re becoming older 😂

      <br><br>

      Enjoy your cake, photos, and fake maturity
      for one day 😌✨

    </div>

    <button class="btn">
      Next 💖
    </button>

  </div>

</div>

</body>
</html>
